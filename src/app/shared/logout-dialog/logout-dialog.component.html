<h1 mat-dialog-title>{{ 'labels.heading.Sign Out' | translate }}</h1>
<mat-dialog-content>
  <p>{{ 'labels.dialogContext.Are you sure you want to log out' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button [mat-dialog-close]="false">{{ 'labels.buttons.Cancel' | translate }}</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="true">
    {{ 'labels.buttons.Sign Out' | translate }}
  </button>
</mat-dialog-actions>
